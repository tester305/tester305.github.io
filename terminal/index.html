<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript terminal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div style="text-align: center;">
<h1 style="font-family: Arial, sans-serif; font-weight: bold;">Wowzah!</h1>
<p style="font-family: Arial, sans-serif;">
<div class="terminal-container">
<div id="terminalOutput" class="terminal-output"></div>
<textarea id="terminalInput" class="terminal-input" placeholder="Enter your JavaScript code here"></textarea>
<button id="executeButton" class="terminal-button">Execute</button>
<button id="clearButton" class="terminal-button">Clear</button>
</div>
</p>
</div>

<script src="bundle.js"></script>
<script src="script.js"></script>
</body>
</html>
